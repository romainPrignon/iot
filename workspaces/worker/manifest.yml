---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: iot
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker.io/iot/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: worker
          ports:
            - containerPort: 4010
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 4010
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 4010
          #   initialDelaySeconds: 5
          #   periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: iot
  labels:
    app: worker
spec:
  type: ClusterIP
  ports:
    - port: 4010
      targetPort: 4010
  selector:
    app: worker

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: iot-data-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres:/var/lib/postgresql

  data:
    # just for info: the dependency dag can't be declared here
    # depends_on:
      # - libs
    build:
      context: .
      tags:
        - iot/data:latest

volumes:
  postgres:
    name: iot-data-postgres-volume
